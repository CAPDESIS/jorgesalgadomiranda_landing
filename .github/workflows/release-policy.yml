name: Release Policy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily to avoid runner bottlenecks.
    - cron: '30 11 * * *'
jobs:
  audit:
    name: Audit release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Audit workflows
        env:
          ENFORCE: 'true'
          PRODUCTION_DAY: 'weekly-manual'
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          findings=0
          warnings=0

          # Runner policy depends on repository visibility. The event payload
          # carries it for workflow_dispatch and schedule; fall back to the API
          # rather than guessing, because guessing wrong either hides a real
          # violation or invents one.
          repo_is_private="${REPO_IS_PRIVATE:-}"
          if [ "$repo_is_private" != "true" ] && [ "$repo_is_private" != "false" ]; then
            repo_is_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          fi
          if [ "$repo_is_private" != "true" ] && [ "$repo_is_private" != "false" ]; then
            echo "::error::Could not resolve repository visibility; refusing to audit runner policy on a guess."
            exit 1
          fi
          summary="${GITHUB_STEP_SUMMARY:-/tmp/release-policy-summary.md}"

          note() {
            printf '%s\n' "$*" | tee -a "$summary"
          }

          warn() {
            warnings=$((warnings + 1))
            note "- WARNING: $*"
          }

          fail() {
            findings=$((findings + 1))
            note "- FAIL: $*"
          }

          has_top_level_key() {
            local file="$1"
            local key="$2"
            grep -Eq "^${key}:" "$file"
          }

          workflow_has() {
            local file="$1"
            local pattern="$2"
            # Strip YAML comments before matching. Prose in a comment is not a
            # policy signal: test.yml only mentions "production" inside a note
            # about the deploy workflow, and matching that raised a false
            # "references production but does not declare environment:
            # production" warning on a workflow that never deploys anything.
            sed -E 's/(^|[[:space:]])#.*$//' "$file" | grep -Eiq "$pattern"
          }

          note "# CAPDESIS Release Policy Audit"
          note ""
          note "- Repository: \`${GITHUB_REPOSITORY}\`"
          note "- Production release cadence: \`weekly-manual\`"
          note "- Repository is private: \`${repo_is_private}\`"
          note "- Enforcement: \`${ENFORCE}\`"
          note ""

          if [ ! -d .github/workflows ]; then
            note "No workflows found. This repo has no deploy automation to audit yet."
            exit 0
          fi

          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            note "No YAML workflows found. This repo has no deploy automation to audit yet."
            exit 0
          fi

          deploy_count=0
          staging_count=0
          production_count=0

          note "## Workflow Findings"
          note ""

          for file in "${workflow_files[@]}"; do
            base="$(basename "$file")"
            is_policy=false
            case "$base" in
              release-policy.yml|release-policy.yaml)
                is_policy=true
                ;;
            esac

            is_deploy=false
            is_staging=false
            is_prod=false

            if [[ "$base" =~ [Dd]eploy ]] || workflow_has "$file" "docker compose|rsync|ssh .+@|scp |kubectl|fly deploy|vercel|hostinger"; then
              is_deploy=true
              deploy_count=$((deploy_count + 1))
            fi
            if workflow_has "$file" "environment:[[:space:]]*staging|staging-node|staging[.-]|STAGING_"; then
              is_staging=true
              staging_count=$((staging_count + 1))
            fi
            if workflow_has "$file" "environment:[[:space:]]*production|deploy-prod|production|PRODUCTION_|web-app-proxy|ancare"; then
              is_prod=true
              production_count=$((production_count + 1))
            fi

            if [ "$is_policy" = true ]; then
              continue
            fi

            case "$base" in
              stage-backend-release.yml|promote-backend-production.yml|auto-deploy-backend.yml|k6-staging-smoke.yml)
                note "- retired fail-closed staging/automatic path: $base"
                continue
                ;;
            esac

            if [ "$is_deploy" = true ] && ! has_top_level_key "$file" "concurrency"; then
              warn "\`${base}\` is deploy-like but has no top-level \`concurrency\`. Serialize deploys to avoid overlapping releases."
            fi

            if [ "$is_staging" = true ] && ! workflow_has "$file" "environment:[[:space:]]*staging"; then
              warn "\`${base}\` references staging but does not declare \`environment: staging\`."
            fi

            if [ "$is_prod" = true ]; then
              if ! workflow_has "$file" "environment:[[:space:]]*production"; then
                warn "\`${base}\` references production but does not declare \`environment: production\`."
              fi
              if ! workflow_has "$file" "workflow_dispatch"; then
                warn "\`${base}\` references production but has no manual \`workflow_dispatch\` entrypoint."
              fi
              if workflow_has "$file" "branches:[[:space:]]*\\[[^]]*main|branches:[[:space:]]*\\[[^]]*master|branches:" && workflow_has "$file" "push:"; then
                warn "\`${base}\` appears to deploy from push. Production should use an exact main SHA through manual approval."
              fi
            fi

            # Fleet runner policy: private repositories are pinned 100%
            # self-hosted; public repositories run CI on GitHub hosted runners
            # and keep deploys on the self-hosted deploy lane. A blanket
            # "ubuntu-latest is wrong" rule contradicted that policy and warned
            # on every CI workflow of this public repo.
            if workflow_has "$file" "runs-on:[[:space:]]*['\"]?(ubuntu|macos|windows|blacksmith)-"; then
              if [ "$repo_is_private" = "true" ]; then
                fail "\`${base}\` runs on a GitHub hosted runner. Private repositories are pinned 100% self-hosted."
              elif [ "$is_deploy" = true ]; then
                fail "\`${base}\` is deploy-like but runs on a GitHub hosted runner. Deploys must stay on the self-hosted deploy lane."
              else
                note "- OK: \`${base}\` runs CI on a GitHub hosted runner, which is the policy for a public repository."
              fi
            elif [ "$is_deploy" = true ] && [ "$repo_is_private" = "false" ]; then
              if ! workflow_has "$file" "public-only"; then
                fail "\`${base}\` is a deploy workflow in a public repository but its runner labels omit \`public-only\`. Runner group \`deploys\` refuses public repositories, so the job would queue forever."
              fi
            fi
          done

          note ""
          note "## Fleet Contract"
          note ""
          note "- Every merge to \`main\` should pass required checks and produce a deployable artifact."
          note "- Production deploys should use \`workflow_dispatch\`, \`environment: production\`, and an exact current main SHA."
          note "- Normal production releases are weekly/manual; emergency hotfixes require explicit approval."
          note "- Database migrations must be backward-compatible and backed up before production."
          note "- Deploy jobs must run on \`ci-runner-node\` with \`deploy-only\`, not on production app hosts."
          note ""
          note "## Counts"
          note ""
          note "- Workflows scanned: ${#workflow_files[@]}"
          note "- Deploy-like workflows: ${deploy_count}"
          note "- Staging references: ${staging_count}"
          note "- Production references: ${production_count}"
          note "- Warnings: ${warnings}"
          note "- Failures: ${findings}"

          if [ "$ENFORCE" = "true" ] && { [ "$warnings" -gt 0 ] || [ "$findings" -gt 0 ]; }; then
            echo "::error::Release policy findings found with enforce=true"
            exit 1
          fi
