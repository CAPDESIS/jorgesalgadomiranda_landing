name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: jsm-landing-ci-${{ github.ref }}
  # Never cancel the main verdict (fleet guard G2); stale PR runs may still cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Static site validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate static site
        run: bun run lint
      - name: Build (static validator)
        run: bun run build
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/validate-static-site.py
      - name: Validate local deploy script syntax
        run: bash -n scripts/deploy.sh
      - name: Validate release SHA guard fails before deploy
        run: |
          set -euo pipefail
          if RELEASE_SHA=bad FTP_HOST=example.com FTP_USER=user FTP_PASS=pass bash scripts/deploy.sh; then
            echo "::error::invalid RELEASE_SHA unexpectedly passed"
            exit 1
          fi
      - name: Install actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.7"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_sha256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o "$archive" "${base_url}/${archive}"
          printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum -c -
          tar xzf "$archive" actionlint
          chmod +x actionlint
          rm -f "$archive"
      - name: Validate GitHub Actions workflows
        run: ./actionlint -config-file .github/actionlint.yaml
