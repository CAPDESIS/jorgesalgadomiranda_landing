name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: jsm-landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static site validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, public-only, ci-runner-node, test-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Validate static site
        run: bun run lint
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/validate-static-site.py
      - name: Validate local deploy script syntax
        run: bash -n scripts/deploy.sh
      - name: Validate release SHA guard fails before deploy
        run: |
          set -euo pipefail
          if RELEASE_SHA=bad FTP_HOST=example.com FTP_USER=user FTP_PASS=pass bash scripts/deploy.sh; then
            echo "::error::invalid RELEASE_SHA unexpectedly passed"
            exit 1
          fi
      - name: Validate GitHub Actions workflows
        run: actionlint -config-file .github/actionlint.yaml
